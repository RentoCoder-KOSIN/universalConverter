; アップロード上限（アプリ側の最大は動画の CONVERTER 設定 30MB。それより少し大きくしておく）
upload_max_filesize = 32M
post_max_size = 40M
; 変換結果をメモリに読み込んで返すため、余裕を持たせる
memory_limit = 256M
; 動画の変換は最大 120 秒かかる（config/converter.php の timeout）
max_execution_time = 150
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
