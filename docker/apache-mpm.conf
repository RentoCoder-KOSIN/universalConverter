# 小さなインスタンスでメモリを使い切らないよう、同時に処理するリクエスト数を絞る。
# 変換そのものの同時実行数は CONVERTER_MAX_CONCURRENT（アプリ側）で別に制限している。
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    MaxRequestWorkers       8
    MaxConnectionsPerChild  200
</IfModule>

Timeout 90
ServerTokens Prod
ServerSignature Off
